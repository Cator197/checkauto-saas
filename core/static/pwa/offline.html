<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheckAuto - Offline</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 24px;
        max-width: 640px;
        margin: 0 auto;
        color: #0f172a;
      }
      .card {
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 20px;
        background: #fff;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin-top: 0;
      }
      p {
        color: #475569;
        line-height: 1.5;
      }
      .muted {
        font-size: 14px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Você está offline</h1>
      <p>Não foi possível carregar a página agora. Quando a conexão voltar, recarregue para sincronizar.</p>
      <p class="muted">Dica: se já acessou esta tela com conexão, algumas ações podem continuar disponíveis offline.</p>
    </div>
  </body>
</html>
